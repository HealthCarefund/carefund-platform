[package]
name = "provider-registry"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "28.0.0"

[dev-dependencies]
soroban-sdk = { version = "28.0.0", features = ["testutils"] }
ed25519-dalek = "2.2.0"
sha2 = "0.10.9"
rand = "0.8.8"

[features]
testutils = ["soroban-sdk/testutils"]
