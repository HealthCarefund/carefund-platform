[package]
name = "care-agreement"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "29.0.1"

[dev-dependencies]
soroban-sdk = { version = "29.0.1", features = ["testutils"] }
provider-registry = { path = "../provider-registry", features = ["testutils"] }
ed25519-dalek = "2.2.0"
sha2 = "0.10.9"
rand = "0.8.8"

[features]
testutils = ["soroban-sdk/testutils"]
