[package]
name = "care-agreement"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "28.0.0"

[dev-dependencies]
soroban-sdk = { version = "28.0.0", features = ["testutils"] }
provider-registry = { path = "../provider-registry", features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
