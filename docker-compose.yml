services:
  postgres:
    image: postgres:18.6-bookworm
    container_name: carefund-pg18
    environment:
      POSTGRES_USER: carefund
      POSTGRES_PASSWORD: carefund_dev
      POSTGRES_DB: carefund
    ports:
      - "5439:5432"
    volumes:
      - carefund-pg18-data:/var/lib/postgresql

volumes:
  carefund-pg18-data:
