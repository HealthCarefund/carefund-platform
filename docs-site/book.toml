[book]
title = "CareFund Documentation"
authors = ["CareFund Contributors"]
language = "en"
src = "src"

[build]
build-dir = "book"
create-missing = false

[output.html]
git-repository-url = "https://github.com/HealthCarefund/carefund-platform"
edit-url-template = "https://github.com/HealthCarefund/carefund-platform/edit/main/docs-site/{path}"
site-url = "/carefund-platform/"
default-theme = "light"
preferred-dark-theme = "navy"

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3
